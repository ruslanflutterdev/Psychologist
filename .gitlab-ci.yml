# Использование кеша для ускорения 'flutter pub get'
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pub-cache/
  policy: pull-push

# Определяем последовательность выполнения этапов (stages)
stages:
  - build
  - test
  - deploy_staging
  - deploy_production

# Общие переменные
variables:
  FLUTTER_BASE_HREF: /
  BUILD_DIR: build/web
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

# ====================
# ШАБЛОН ДЛЯ FLUTTER CI
# ====================
.flutter_template:
  image: instrumentisto/flutter:3.35
  before_script:
    - export PATH="$PATH:$PUB_CACHE/bin"
    - flutter pub get

# ====================
# 1. BUILD (Сборка артефакта)
# ====================
build_web:
  stage: build
  extends: .flutter_template
  script:
    - flutter build web --release --base-href $FLUTTER_BASE_HREF
  artifacts:
    paths:
      - $BUILD_DIR
    expire_in: 1 week

# ====================
# 2. TEST (Тестирование)
# ====================
run_tests:
  stage: test
  extends: .flutter_template
  script:
    - flutter test --coverage
  allow_failure: true

# ====================================
# 3. DEPLOYMENT BASE (Шаблон для развертывания)
# ====================================
.deploy_base:
  image: alpine:3.19
  before_script:
    # Установка утилит
    - apk update && apk add openssh-client rsync
    - eval $(ssh-agent -s)

    # 1. Декодируем Base64 строку и создаем файл
    - echo "$DPL_SSH_KEY" | base64 -d > deploy_key.pem
    # 2. Устанавливаем права доступа
    - chmod 600 deploy_key.pem
    # 3. Загружаем незашифрованный ключ из файла
    - ssh-add deploy_key.pem

    # Создание папки .ssh для известных хостов
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  dependencies:
    - build_web

# ====================
# 4. DEPLOY TO SITE 1 (STAGING/TEST)
# ====================
deploy_staging:
  stage: deploy_staging
  extends: .deploy_base
  environment:
    name: staging
    # [!code change] Обновление URL на новые переменные
    url: http://${DPL_HOST}/${STG_PATH}
  script:
    - echo "Deploying to Staging site at $DPL_HOST:$STG_PATH"
    # [!code change] Использование DPL_USER, DPL_HOST, STG_PATH
    - ssh ${DPL_USER}@${DPL_HOST} "mkdir -p $STG_PATH"
    - rsync -av --delete $BUILD_DIR/ ${DPL_USER}@${DPL_HOST}:$STG_PATH
    - echo "Staging deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

# ====================
# 5. DEPLOY TO SITE 2 (PRODUCTION)
# ====================
deploy_production:
  stage: deploy_production
  extends: .deploy_base
  environment:
    name: production
    # [!code change] Обновление URL на новые переменные
    url: http://${DPL_HOST}/${PROD_PATH}
  script:
    - echo "Deploying to Production site at $DPL_HOST:$PROD_PATH"
    # [!code change] Использование DPL_USER, DPL_HOST, PROD_PATH
    - ssh ${DPL_USER}@${DPL_HOST} "mkdir -p $PROD_PATH"
    - rsync -av --delete $BUILD_DIR/ ${DPL_USER}@${DPL_HOST}:$PROD_PATH
    - echo "Production deployment complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Ожидает ручного запуска
      allow_failure: false